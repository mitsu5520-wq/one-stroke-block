<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ONE STROKE BLOCK - Prototype</title>
<style>
:root{--bg:#0e1118;--panel:#171c27;--cell:#252c3a;--line:#394256;--text:#f5f7fb;--muted:#98a2b3;--accent:#7c9cff;--accent2:#a98bff;--good:#72d6a3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#182033 0,#0e1118 45%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;justify-content:center;padding:18px 14px 30px;overscroll-behavior:none}.app{width:min(100%,520px)}.top{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:12px}.title{font-size:19px;font-weight:800;letter-spacing:.06em}.sub{color:var(--muted);font-size:12px;margin-top:4px}.scorebox{text-align:right}.scorelabel{font-size:11px;color:var(--muted)}.score{font-size:30px;font-weight:900;line-height:1}.panel{background:rgba(23,28,39,.92);border:1px solid #2c3444;border-radius:20px;padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.28)}.numbers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.num{appearance:none;border:1px solid #34405a;background:#202838;color:#fff;border-radius:16px;padding:10px 6px;min-height:70px;font-size:30px;font-weight:900;position:relative}.num small{display:block;font-size:10px;color:var(--muted);font-weight:700;margin-top:2px}.num.selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(124,156,255,.22) inset;background:#26324a}.num.used{opacity:.28;filter:saturate(.3);pointer-events:none}.board{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;width:100%;aspect-ratio:1/1;touch-action:none;user-select:none}.cell{background:var(--cell);border:1px solid var(--line);border-radius:8px;position:relative;transition:transform .08s ease,background .1s ease,border-color .1s ease}.cell.filled{background:linear-gradient(145deg,#6f8cff,#4d67d9);border-color:#7893ff;box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}.cell.path{background:linear-gradient(145deg,#b2c2ff,#7894ff);border-color:#d8e0ff;transform:scale(.96)}.cell.path:after{content:attr(data-step);position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:900;color:#15204b}.status{min-height:42px;display:flex;align-items:center;justify-content:center;text-align:center;color:#d9dfec;font-size:13px;margin:12px 4px 2px}.hint{color:var(--muted);font-size:11px;text-align:center;margin-top:8px;line-height:1.5}.actions{display:flex;gap:10px;margin-top:14px}.action{flex:1;border:1px solid #374158;border-radius:14px;background:#202838;color:#fff;font-weight:800;padding:12px}.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-bottom:8px}.dot{width:8px;height:8px;border-radius:50%;background:var(--good)}.overlay{position:fixed;inset:0;background:rgba(4,7,12,.72);display:none;align-items:center;justify-content:center;padding:24px;z-index:20}.overlay.show{display:flex}.modal{width:min(100%,380px);background:#171c27;border:1px solid #30394d;border-radius:22px;padding:22px;text-align:center;box-shadow:0 25px 80px rgba(0,0,0,.5)}.modal h2{margin:0 0 8px;font-size:28px}.modal p{color:var(--muted);margin:8px 0 18px}.big{font-size:42px;font-weight:900;margin:8px 0 16px}.primary{width:100%;border:0;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:900;padding:13px}.flash{animation:flash .28s ease}@keyframes flash{50%{transform:scale(1.025)}}
</style>
</head>
<body>
<div class="app"><div class="top"><div><div class="title">ONE STROKE BLOCK</div><div class="sub">8×8 / prototype</div></div><div class="scorebox"><div class="scorelabel">SCORE</div><div id="score" class="score">0</div></div></div><div class="panel"><div class="badge"><span class="dot"></span><span>数字を選んで、その数だけ盤面を一筆書き</span></div><div id="numbers" class="numbers"></div><div id="board" class="board"></div><div id="status" class="status">数字を1つ選んでください</div><div class="hint">上下左右のみ / 斜め不可 / 同じマスは2回通れません<br>3つ全部使うと、新しい数字が3つ出ます</div><div class="actions"><button id="restart" class="action">最初から</button></div></div></div>
<div id="gameover" class="overlay"><div class="modal"><h2>GAME OVER</h2><p>これ以上、一筆書きできる数字がありません</p><div id="finalScore" class="big">0</div><button id="again" class="primary">もう一回</button></div></div>
<script>
(()=>{const SIZE=8,MIN_N=3,MAX_N=8;const boardEl=document.getElementById('board'),numbersEl=document.getElementById('numbers'),scoreEl=document.getElementById('score'),statusEl=document.getElementById('status'),overlay=document.getElementById('gameover'),finalScore=document.getElementById('finalScore');let board=[],trio=[],used=[],selected=-1,path=[],drawing=false,score=0,combo=0,gameEnded=false;const randNum=()=>Math.floor(Math.random()*(MAX_N-MIN_N+1))+MIN_N;
function resetGame(){board=Array.from({length:SIZE},()=>Array(SIZE).fill(0));trio=[randNum(),randNum(),randNum()];used=[false,false,false];selected=-1;path=[];drawing=false;score=0;combo=0;gameEnded=false;overlay.classList.remove('show');render();statusEl.textContent='数字を1つ選んでください'}
function buildBoard(){boardEl.innerHTML='';for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){const cell=document.createElement('div');cell.className='cell';cell.dataset.r=r;cell.dataset.c=c;boardEl.appendChild(cell)}}
function renderNumbers(){numbersEl.innerHTML='';trio.forEach((n,i)=>{const b=document.createElement('button');b.className='num'+(selected===i?' selected':'')+(used[i]?' used':'');b.innerHTML=`${n}<small>${used[i]?'使用済み':'SELECT'}</small>`;b.onclick=()=>{if(gameEnded||used[i])return;selected=i;path=[];statusEl.textContent=`${n}マスを一筆書き`;renderNumbers();renderBoard()};numbersEl.appendChild(b)})}
function renderBoard(){[...boardEl.children].forEach(cell=>{const r=+cell.dataset.r,c=+cell.dataset.c;cell.className='cell';cell.removeAttribute('data-step');if(board[r][c])cell.classList.add('filled');const idx=path.findIndex(p=>p[0]===r&&p[1]===c);if(idx>=0){cell.classList.add('path');cell.dataset.step=idx+1}})}
function render(){scoreEl.textContent=score.toLocaleString();renderNumbers();renderBoard()}
function coordsFromElement(el){const cell=el&&el.closest?el.closest('.cell'):null;return cell?[+cell.dataset.r,+cell.dataset.c]:null}const same=(a,b)=>a[0]===b[0]&&a[1]===b[1],adjacent=(a,b)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])===1;
function tryAdd(coord){if(selected<0||used[selected]||gameEnded)return;const need=trio[selected],[r,c]=coord;if(board[r][c]||path.some(p=>same(p,coord))||(path.length&&!adjacent(path[path.length-1],coord))||path.length>=need)return;path.push(coord);renderBoard();statusEl.textContent=`${path.length} / ${need}`}
function clearLines(){const rows=[],cols=[];for(let r=0;r<SIZE;r++)if(board[r].every(v=>v===1))rows.push(r);for(let c=0;c<SIZE;c++){let full=true;for(let r=0;r<SIZE;r++)if(board[r][c]!==1){full=false;break}if(full)cols.push(c)}rows.forEach(r=>{for(let c=0;c<SIZE;c++)board[r][c]=0});cols.forEach(c=>{for(let r=0;r<SIZE;r++)board[r][c]=0});return rows.length+cols.length}
function finishStroke(){if(!drawing)return;drawing=false;if(selected<0)return;const need=trio[selected];if(path.length!==need){statusEl.textContent=`${need}マス必要です。もう一度なぞってください`;path=[];renderBoard();return}path.forEach(([r,c])=>board[r][c]=1);used[selected]=true;const lines=clearLines();score+=need;if(lines>0){combo++;const lp=lines===1?100:lines===2?260:260+(lines-2)*220,b=(combo-1)*25;score+=lp+b;statusEl.textContent=lines>=2?`${lines}ライン同時消し！ +${lp+b}`:`ライン消去！ +${lp+b}`;boardEl.classList.remove('flash');void boardEl.offsetWidth;boardEl.classList.add('flash')}else{combo=0;statusEl.textContent=`+${need}　次の数字を選んでください`}selected=-1;path=[];if(used.every(Boolean)){trio=[randNum(),randNum(),randNum()];used=[false,false,false];statusEl.textContent=`NEW：${trio.join('・')}`}render();requestAnimationFrame(checkGameOver)}
function hasPathOfLength(n){const seen=Array.from({length:SIZE},()=>Array(SIZE).fill(false));function dfs(r,c,d){if(d===n)return true;seen[r][c]=true;for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){const nr=r+dr,nc=c+dc;if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&!board[nr][nc]&&!seen[nr][nc]&&dfs(nr,nc,d+1)){seen[r][c]=false;return true}}seen[r][c]=false;return false}for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(!board[r][c]&&dfs(r,c,1))return true;return false}
function checkGameOver(){const remaining=trio.map((n,i)=>({n,i})).filter(x=>!used[x.i]);if(remaining.length&& !remaining.some(x=>hasPathOfLength(x.n))){gameEnded=true;finalScore.textContent=score.toLocaleString();overlay.classList.add('show')}}
boardEl.addEventListener('pointerdown',e=>{if(selected<0||gameEnded)return;const coord=coordsFromElement(e.target);if(!coord)return;drawing=true;path=[];tryAdd(coord);try{boardEl.setPointerCapture(e.pointerId)}catch(_){}});boardEl.addEventListener('pointermove',e=>{if(!drawing||selected<0||gameEnded)return;const coord=coordsFromElement(document.elementFromPoint(e.clientX,e.clientY));if(coord)tryAdd(coord)});boardEl.addEventListener('pointerup',finishStroke);boardEl.addEventListener('pointercancel',()=>{drawing=false;path=[];renderBoard()});document.getElementById('restart').onclick=resetGame;document.getElementById('again').onclick=resetGame;buildBoard();resetGame()})();
</script>
</body>
</html>
