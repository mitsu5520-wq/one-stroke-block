<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>ONE STROKE BLOCK v2</title><style>
:root{--bg:#0e1118;--panel:#171c27;--cell:#252c3a;--line:#394256;--text:#f5f7fb;--muted:#98a2b3;--accent:#7c9cff;--accent2:#a98bff}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#182033,#0e1118 45%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;justify-content:center;padding:calc(14px + env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom));overscroll-behavior:none}.app{width:min(100%,520px)}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:10px}.title{font-size:18px;font-weight:900}.sub,.scorelabel,.hint{color:var(--muted)}.sub{font-size:11px}.scorebox{text-align:right}.scorelabel{font-size:10px}.score{font-size:28px;font-weight:900}.panel{background:rgba(23,28,39,.96);border:1px solid #2c3444;border-radius:20px;padding:12px}.numbers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.num{border:1px solid #34405a;background:#202838;color:#fff;border-radius:15px;min-height:64px;font-size:28px;font-weight:900}.num small{display:block;font-size:9px;color:var(--muted)}.num.selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(124,156,255,.22) inset}.num.used{opacity:.25;pointer-events:none}.board{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;width:100%;aspect-ratio:1;touch-action:none;user-select:none}.cell{background:var(--cell);border:1px solid var(--line);border-radius:8px;position:relative;overflow:hidden;transition:.1s}.cell.filled{background:linear-gradient(145deg,#6f8cff,#4d67d9);border-color:#7893ff}.cell.path{background:linear-gradient(145deg,#c4d0ff,#7b96ff);border-color:#e4e9ff;transform:scale(.95)}.cell.path:after{content:attr(data-step);position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:900;color:#16234d}.cell.d1:before,.cell.d2:before,.cell.d3:before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none}.cell.d1:before{background:linear-gradient(135deg,transparent 47%,#f3c773 49%,transparent 52%)}.cell.d2:before{background:linear-gradient(135deg,transparent 46%,#ff956c 49%,transparent 52%),linear-gradient(45deg,transparent 46%,#ff956c 49%,transparent 52%)}.cell.d3{background:#11151d!important;border-color:#2d3441!important}.cell.d3:before{background:linear-gradient(135deg,transparent 44%,#ff6578 47%,#ff6578 51%,transparent 54%),linear-gradient(45deg,transparent 44%,#ff6578 47%,#ff6578 51%,transparent 54%)}.cell.d3:after{content:"×";position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-weight:900;color:#ff7586;z-index:3}.status{min-height:42px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;margin-top:10px}.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:6px}.legend div{background:#1d2330;border:1px solid #2d3546;border-radius:9px;padding:6px 2px;text-align:center;font-size:9px;color:var(--muted)}.legend b{display:block;color:#fff;font-size:10px}.hint{text-align:center;font-size:10px;line-height:1.45;margin-top:8px}.action,.primary{border-radius:13px;color:white;font-weight:900;padding:11px}.action{width:100%;margin-top:10px;border:1px solid #374158;background:#202838}.overlay{position:fixed;inset:0;background:rgba(4,7,12,.76);display:none;align-items:center;justify-content:center;padding:24px;z-index:20}.overlay.show{display:flex}.modal{width:min(100%,380px);background:#171c27;border:1px solid #30394d;border-radius:22px;padding:22px;text-align:center}.modal h2{margin:0}.modal p{color:var(--muted)}.big{font-size:40px;font-weight:900;margin:8px 0 16px}.primary{width:100%;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2))}.heal{animation:heal .42s ease}@keyframes heal{50%{box-shadow:0 0 0 4px rgba(114,214,163,.65) inset;transform:scale(.9)}}
</style></head><body><div class="app"><div class="top"><div><div class="title">ONE STROKE BLOCK</div><div class="sub">PROTOTYPE v2 / FLOOR DAMAGE</div></div><div class="scorebox"><div class="scorelabel">SCORE</div><div id="score" class="score">0</div></div></div><div class="panel"><div id="numbers" class="numbers"></div><div id="board" class="board"></div><div id="status" class="status">数字を選んで、その数だけ一筆書き</div><div class="legend"><div><b>正常</b>0</div><div><b>ヒビ</b>1</div><div><b>大ヒビ</b>2</div><div><b>使用不可</b>3</div></div><div class="hint">1ライン消去ごとに、そのラインから3マスが1段階劣化<br>2ライン同時＝3マス回復 / 3ライン以上＝6マス回復<br>回復は一番劣化しているマスを優先</div><button id="restart" class="action">最初から</button></div></div><div id="gameover" class="overlay"><div class="modal"><h2>GAME OVER</h2><p>残っている数字を一筆書きできません</p><div id="finalScore" class="big">0</div><button id="again" class="primary">もう一回</button></div></div><script>
(()=>{const S=8;const B=document.getElementById('board'),N=document.getElementById('numbers'),SC=document.getElementById('score'),ST=document.getElementById('status'),OV=document.getElementById('gameover'),FS=document.getElementById('finalScore');let occ,dmg,trio,used,sel,path,drawing,score,combo,ended,healed=[];const rnd=()=>Math.floor(Math.random()*6)+3,key=(r,c)=>r+','+c;
function reset(){occ=Array.from({length:S},()=>Array(S).fill(0));dmg=Array.from({length:S},()=>Array(S).fill(0));trio=[rnd(),rnd(),rnd()];used=[0,0,0];sel=-1;path=[];drawing=false;score=combo=0;ended=false;healed=[];OV.classList.remove('show');render();ST.textContent='数字を選んで、その数だけ一筆書き'}
function build(){B.innerHTML='';for(let r=0;r<S;r++)for(let c=0;c<S;c++){let e=document.createElement('div');e.className='cell';e.dataset.r=r;e.dataset.c=c;B.appendChild(e)}}
function renderNums(){N.innerHTML='';trio.forEach((n,i)=>{let b=document.createElement('button');b.className='num'+(sel===i?' selected':'')+(used[i]?' used':'');b.innerHTML=`${n}<small>${used[i]?'使用済み':'SELECT'}</small>`;b.onclick=()=>{if(ended||used[i])return;sel=i;path=[];ST.textContent=`${n}マスを一筆書き`;renderNums();renderBoard()};N.appendChild(b)})}
function renderBoard(){[...B.children].forEach(e=>{let r=+e.dataset.r,c=+e.dataset.c;e.className='cell';e.removeAttribute('data-step');if(occ[r][c])e.classList.add('filled');if(dmg[r][c])e.classList.add('d'+dmg[r][c]);let i=path.findIndex(p=>p[0]===r&&p[1]===c);if(i>=0){e.classList.add('path');e.dataset.step=i+1}if(healed.includes(key(r,c)))e.classList.add('heal')});if(healed.length)setTimeout(()=>{healed=[];renderBoard()},420)}
function render(){SC.textContent=score.toLocaleString();renderNums();renderBoard()}function coord(el){let e=el&&el.closest?el.closest('.cell'):null;return e?[+e.dataset.r,+e.dataset.c]:null}const same=(a,b)=>a[0]===b[0]&&a[1]===b[1],adj=(a,b)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])===1;
function add(p){if(sel<0||used[sel]||ended)return;let n=trio[sel],[r,c]=p;if(occ[r][c]||dmg[r][c]>=3||path.some(x=>same(x,p))||(path.length&&!adj(path.at(-1),p))||path.length>=n)return;path.push(p);renderBoard();ST.textContent=`${path.length} / ${n}`}
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function degrade(cells){shuffle(cells).slice(0,3).forEach(([r,c])=>dmg[r][c]=Math.min(3,dmg[r][c]+1))}
function recover(count){healed=[];for(let k=0;k<count;k++){let worst=0,cs=[];for(let r=0;r<S;r++)for(let c=0;c<S;c++){if(dmg[r][c]>worst){worst=dmg[r][c];cs=[[r,c]]}else if(worst>0&&dmg[r][c]===worst)cs.push([r,c])}if(!worst)break;let [r,c]=cs[Math.floor(Math.random()*cs.length)];dmg[r][c]--;healed.push(key(r,c))}}
function lines(){let rows=[],cols=[];for(let r=0;r<S;r++)if(occ[r].every(Boolean))rows.push(r);for(let c=0;c<S;c++){let ok=1;for(let r=0;r<S;r++)if(!occ[r][c]){ok=0;break}if(ok)cols.push(c)}let count=rows.length+cols.length;if(!count)return{count:0,heal:0};rows.forEach(r=>{for(let c=0;c<S;c++)occ[r][c]=0});cols.forEach(c=>{for(let r=0;r<S;r++)occ[r][c]=0});rows.forEach(r=>degrade(Array.from({length:S},(_,c)=>[r,c])));cols.forEach(c=>degrade(Array.from({length:S},(_,r)=>[r,c])));let h=count===2?3:count>=3?6:0;if(h)recover(h);return{count,heal:h}}
function finish(){if(!drawing)return;drawing=false;if(sel<0)return;let need=trio[sel];if(path.length!==need){ST.textContent=`${need}マス必要。もう一度なぞって`;path=[];renderBoard();return}path.forEach(([r,c])=>occ[r][c]=1);used[sel]=1;let x=lines();score+=need;if(x.count){combo++;let lp=x.count===1?100:x.count===2?280:280+(x.count-2)*240,cb=(combo-1)*25;score+=lp+cb;ST.textContent=`${x.count}ライン消去！ +${lp+cb}`+(x.heal?` / 床${x.heal}マス回復`:'')}else{combo=0;ST.textContent=`+${need}　次の数字を選んで`}sel=-1;path=[];if(used.every(Boolean)){trio=[rnd(),rnd(),rnd()];used=[0,0,0];ST.textContent=`NEW：${trio.join('・')}`}render();requestAnimationFrame(check)}
function can(n){let seen=Array.from({length:S},()=>Array(S).fill(0));function dfs(r,c,d){if(d===n)return true;seen[r][c]=1;for(let [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){let nr=r+dr,nc=c+dc;if(nr>=0&&nr<S&&nc>=0&&nc<S&&!occ[nr][nc]&&dmg[nr][nc]<3&&!seen[nr][nc]&&dfs(nr,nc,d+1)){seen[r][c]=0;return true}}seen[r][c]=0;return false}for(let r=0;r<S;r++)for(let c=0;c<S;c++)if(!occ[r][c]&&dmg[r][c]<3&&dfs(r,c,1))return true;return false}
function check(){let rem=trio.map((n,i)=>({n,i})).filter(x=>!used[x.i]);if(rem.length&&!rem.some(x=>can(x.n))){ended=true;FS.textContent=score.toLocaleString();OV.classList.add('show')}}
B.addEventListener('pointerdown',e=>{if(sel<0||ended)return;let p=coord(e.target);if(!p)return;drawing=true;path=[];add(p);try{B.setPointerCapture(e.pointerId)}catch(_){}});B.addEventListener('pointermove',e=>{if(!drawing||sel<0||ended)return;let p=coord(document.elementFromPoint(e.clientX,e.clientY));if(p)add(p)});B.addEventListener('pointerup',finish);B.addEventListener('pointercancel',()=>{drawing=false;path=[];renderBoard()});document.getElementById('restart').onclick=reset;document.getElementById('again').onclick=reset;build();reset()})();
</script></body></html>
